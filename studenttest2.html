<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math | Faculty Console (MathClass DB Backend)</title>
    <link rel="icon" type="image/png" href="NCC.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --accent: #6366f1;
            --accent-dark: #4f46e5;
            --sidebar-bg: #0f172a;
            --canvas: #f8fafc;
            --card-border: rgba(226, 232, 240, 0.8);
            --text-h: #0f172a;
            --text-p: #475569;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--canvas); 
            color: var(--text-h);
            height: 100vh;
            overflow: hidden;
        }

        .portal-layout { 
            display: flex; 
            flex-direction: row;
            height: 100vh; 
            width: 100%; 
            background: var(--canvas); 
            position: relative; 
            z-index: 20; 
        }
        
        .sidebar { 
            width: 280px; 
            background: var(--sidebar-bg); 
            padding: 32px 20px; 
            display: flex; 
            flex-direction: column; 
            flex-shrink: 0; 
        }

        .main-content { 
            flex-grow: 1; 
            padding: 40px; 
            overflow-y: auto; 
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%); 
        }

        .nav-link { 
            padding: 14px 16px; border-radius: var(--radius-md); color: #94a3b8; font-weight: 500; 
            transition: 0.2s; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; gap: 12px; width: 100%; margin-bottom: 4px;
        }
        .nav-link:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-link.active { background: var(--accent); color: white; }

        .card { background: white; border-radius: var(--radius-lg); padding: 28px; border: 1px solid var(--card-border); box-shadow: var(--shadow); }
        .table-responsive { width: 100%; overflow-x: auto; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--card-border); }
        .stat-card h2 { font-size: 1.8rem; margin-top: 4px; font-weight: 800; color: var(--accent); }
        
        .btn { 
            padding: 12px 20px; border-radius: var(--radius-md); font-weight: 700; font-size: 0.95rem;
            cursor: pointer; transition: all 0.3s; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; 
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-dark); }

        input, select { width: 100%; padding: 14px 16px; border: 1.5px solid var(--card-border); border-radius: var(--radius-md); outline: none; margin-bottom: 18px; font-family: inherit; font-size: 15px; background: #fff; }
        input:focus, select:focus { border-color: var(--accent); }

        .hidden { display: none !important; }
        
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; padding: 15px; color: var(--text-p); font-size: 0.85rem; font-weight: 600; border-bottom: 2px solid #f1f5f9; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; color: var(--text-h); font-size: 15px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .file-input-wrapper { border: 1.5px dashed var(--card-border); padding: 20px; border-radius: var(--radius-md); text-align: center; background: #f8fafc; margin-bottom: 18px; }

        @media (max-width: 768px) {
            .portal-layout { flex-direction: column; }
            .sidebar { width: 100%; height: auto; }
            .main-content { padding: 24px 16px; }
            .stat-grid { grid-template-columns: 1fr; gap: 12px; }
        }
    </style>
</head>
<body>

<!-- UPLOAD MODAL -->
<div id="resource-modal" class="modal-overlay hidden">
    <div class="card animate__animated animate__zoomIn" style="width: 100%; max-width: 450px;">
        <h2 style="margin-bottom: 20px; font-weight: 800;">Upload Content</h2>
        
        <input type="text" id="res-title" placeholder="Title">
        
        <select id="res-type">
            <option value="Module">Learning Module</option>
            <option value="Assignment">Assignment</option>
        </select>
        
        <div id="file-upload-zone" class="file-input-wrapper">
            <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-p); display: block; margin-bottom: 10px;">ATTACH FILE (PDF, DOCX, IMG)</label>
            <input type="file" id="res-file" style="border:none; margin:0; padding:0; background:transparent; width:100%;">
        </div>

        <p style="text-align:center; font-size: 0.75rem; font-weight: 600; color: #94a3b8; margin-bottom: 14px;">— OR ENTER EXTERNAL LINK —</p>
        <input type="text" id="res-url" placeholder="Resource Link (URL)">

        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn btn-primary" id="publish-btn" onclick="handleResourceSubmission()" style="flex:2;">Upload & Save</button>
            <button class="btn" style="background:#f1f5f9; color: var(--text-p); flex:1;" onclick="toggleModal(false)">Cancel</button>
        </div>
    </div>
</div>

<!-- MAIN LAYOUT -->
<div id="portal-section" class="portal-layout">
    <aside class="sidebar">
        <div style="margin-bottom: 40px; display: flex; align-items: center; gap: 12px; padding: 0 12px;">
            <img src="NCC.png" alt="Logo" height="32" width="auto">
            <span style="color:white; font-weight:800; font-size:1.25rem;">MathClass</span>
        </div>
        <nav style="flex:1">
            <button class="nav-link active" id="nav-overview" onclick="showTab('overview')"><i class="fas fa-house-chimney"></i> Overview</button>
            <button class="nav-link" id="nav-resources" onclick="showTab('resources')"><i class="fas fa-book-open"></i> Curriculum</button>
        </nav>
    </aside>

    <main class="main-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;" class="header-row">
            <div>
                <span style="color:var(--accent); font-weight:700; font-size:0.8rem; text-transform:uppercase;">MathClass DB Storage</span>
                <h1 id="tab-title" style="font-size:2.2rem; font-weight:800;">Overview</h1>
            </div>
            <button class="btn btn-primary" onclick="toggleModal(true)"><i class="fas fa-plus"></i> Add Content</button>
        </div>

        <div id="tab-overview" class="tab-content">
            <div class="stat-grid">
                <div class="stat-card">
                    <span style="font-size: 0.85rem; font-weight: 500; color: var(--text-p);">Total Modules</span>
                    <h2 id="stat-m-count">0</h2>
                </div>
                <div class="stat-card">
                    <span style="font-size: 0.85rem; font-weight: 500; color: var(--text-p);">Assignments</span>
                    <h2 id="stat-a-count">0</h2>
                </div>
                <div class="stat-card">
                    <span style="font-size: 0.85rem; font-weight: 500; color: var(--text-p);">Total Stored Items</span>
                    <h2 id="stat-s-count">0</h2>
                </div>
            </div>
        </div>

        <div id="tab-resources" class="tab-content hidden">
            <div class="card">
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Title</th><th>Category</th><th>Upload Date</th><th>Drive / Link</th></tr></thead>
                        <tbody id="resource-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    // Paste your Web App URL from Apps Script deployment here:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxF4r_oc-xeGMgL1UBSkoDT6VJISoEFg0vFdjdJpg_BenHJecM854RdhvNa55royfii/exec";

    function toggleModal(show) { document.getElementById('resource-modal').classList.toggle('hidden', !show); }

    function showTab(name) {
        document.getElementById('tab-title').innerText = name.charAt(0).toUpperCase() + name.slice(1);
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.querySelectorAll('.sidebar .nav-link').forEach(l => l.classList.remove('active'));
        document.getElementById(`nav-${name}`).classList.add('active');
        document.getElementById(`tab-${name}`).classList.remove('hidden');
        fetchData();
    }

    async function fetchData() {
        if (GOOGLE_SCRIPT_URL.includes("YOUR_NEWLY")) return;
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL);
            const json = await res.json();
            
            if (json.status === "success" && Array.isArray(json.data)) {
                const items = json.data;
                document.getElementById('stat-m-count').innerText = items.filter(r => r.type === 'Module').length;
                document.getElementById('stat-a-count').innerText = items.filter(r => r.type === 'Assignment').length;
                document.getElementById('stat-s-count').innerText = items.length;

                document.getElementById('resource-list').innerHTML = items.map(r => `
                    <tr>
                        <td style="font-weight:600;">${r.title}</td>
                        <td><span style="background:#edf2ff; color:#4c6ef5; padding:6px 12px; border-radius:30px; font-size:0.75rem; font-weight:700;">${r.type}</span></td>
                        <td style="color:var(--text-p);">${r.date ? new Date(r.date).toLocaleDateString() : 'N/A'}</td>
                        <td>${r.url ? `<a href="${r.url}" target="_blank" class="btn btn-primary" style="padding:8px 14px;"><i class="fas fa-external-link-alt"></i> Open File / Link</a>` : '<span style="color:#94a3b8;">No Link</span>'}</td>
                    </tr>
                `).join('');
            }
        } catch (err) {
            console.error("Error reading from MathClass DB:", err);
        }
    }

    async function handleResourceSubmission() {
        const title = document.getElementById('res-title').value;
        const type = document.getElementById('res-type').value;
        const urlInput = document.getElementById('res-url').value;
        const fileInput = document.getElementById('res-file').files[0];
        const btn = document.getElementById('publish-btn');

        if (!title) return alert("Please enter a title");
        if (!urlInput && !fileInput) return alert("Please attach a file or enter a link");

        btn.innerText = "Saving to Drive & Sheets...";
        btn.disabled = true;

        const payload = {
            title: title,
            type: type,
            url: urlInput || "",
            user: "Faculty Member"
        };

        if (fileInput) {
            const reader = new FileReader();
            reader.onload = async function (e) {
                payload.fileData = e.target.result;
                payload.fileName = fileInput.name;
                payload.fileMime = fileInput.type;
                await sendToGoogleAppsScript(payload);
            };
            reader.readAsDataURL(fileInput);
        } else {
            await sendToGoogleAppsScript(payload);
        }
    }

    async function sendToGoogleAppsScript(payload) {
        const btn = document.getElementById('publish-btn');
        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });

            alert("Content saved to Google Sheet & Drive!");
            toggleModal(false);
            
            document.getElementById('res-title').value = '';
            document.getElementById('res-url').value = '';
            document.getElementById('res-file').value = '';
            
            setTimeout(fetchData, 2000);
        } catch (err) {
            alert("Upload failed: " + err.message);
        } finally {
            btn.innerText = "Upload & Save";
            btn.disabled = false;
        }
    }

    fetchData();
</script>
</body>
</html>
